<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Smart Placement</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- Authentication CSS -->
    <link rel="stylesheet" href="./css/auth.css">

</head>


<body>

    <div class="auth-page">

        <div class="auth-container">

            <div class="auth-form-container">

                <a href="index.html" class="back-home">
                    ← Back to Home
                </a>

                <h2>Welcome Back</h2>

                <p class="auth-subtitle">
                    Login to continue with Smart Placement
                </p>


                <form id="loginForm">

                    <div class="form-group">

                        <label for="loginEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="auth-btn">
                        Login
                    </button>

                </form>


                <div class="divider">
                    <span>OR</span>
                </div>


                <p class="register-text">

                    Don't have an account?

                    <a href="register.html">
                        Register here
                    </a>

                </p>

            </div>

        </div>

    </div>


    <!-- Login JavaScript -->
    <script src="./js/login.js"></script>

</body>

</html>
